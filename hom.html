<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Interactive Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; --wa-green: #25D366; --nav-blue: #001f3f; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #f8f9fa; }

        /* --- Updated Navigation (No Home Button) --- */
        .master-nav {
            background: var(--nav-blue); padding: 12px 0; text-align: center;
            position: fixed; top: 0; width: 100%; z-index: 10000;
            border-bottom: 2px solid #ffb703;
            display: flex; justify-content: center; flex-wrap: nowrap; overflow-x: auto;
        }
        .master-nav a { 
            color: white; text-decoration: none; margin: 0 8px; 
            font-weight: 600; text-transform: uppercase; font-size: 10px;
            white-space: nowrap;
        }

        /* Map Container */
        #map { height: 100vh; width: 100%; z-index: 1; position: relative; }

        /* --- Verified Bouncing Animation --- */
        @keyframes bounceIn {
            0% { transform: translateY(-600px); opacity: 0; }
            60% { transform: translateY(30px); opacity: 1; }
            80% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }
        .bounce-pin { 
            animation: bounceIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important; 
        }

        /* --- Draggable Filter Box --- */
        .leaflet-control-layers {
            background: rgba(255, 255, 255, 0.95) !important;
            border: 2px solid var(--primary-red) !important;
            border-radius: 10px !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2) !important;
            min-width: 200px;
            position: absolute !important;
        }
        .control-header { 
            background: var(--primary-red); color: white; padding: 10px; 
            font-weight: bold; cursor: move; border-radius: 8px 8px 0 0;
            display: flex; justify-content: space-between; align-items: center;
            user-select: none;
        }

        /* Header & Footer */
        .map-header {
            position: absolute; top: 65px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 360px; background: rgba(230, 57, 70, 0.95);
            color: white; padding: 8px; border-radius: 12px; z-index: 5000; text-align: center;
        }
        .sticky-footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; z-index: 10000;
        }
        .sticky-btn { flex: 1; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; color: white; font-size: 13px; }
        .btn-call { background: var(--dark-blue); }
        .btn-wa { background: var(--wa-green); }

        .popup-card { text-align: center; width: 180px; }
        .popup-btn { display: block; margin-top: 8px; padding: 8px; color: white !important; text-decoration: none; border-radius: 5px; background: var(--primary-red); font-weight: bold; }
        
        /* Mobile adjustment for Nav */
        @media (max-width: 480px) {
            .master-nav a { margin: 0 5px; font-size: 9px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<nav class="master-nav">
    <a href="runningprojects.html">Ongoing</a>
    <a href="upcoming.html">Upcoming</a>
    <a href="videos.html">Videos</a>
    <a href="compare.html">Compare</a>
    <a href="about.html">About Us</a>
</nav>

<div class="map-header">
    <strong style="font-size: 14px;">Apka Apna Property Advisor</strong><br>
    <a href="tel:+919818811971" style="color:white; text-decoration:none; font-size: 13px;">📞 98188 11971</a>
</div>

<div id="map"></div>

<div class="sticky-footer">
    <a href="tel:+919818811971" class="sticky-btn btn-call">📞 Call Prince</a>
    <a href="https://wa.me/919818811971" class="sticky-btn btn-wa">💬 WhatsApp</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Map Setup
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
    var bounds = [[0, 0], [1000, 1500]];
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    // Icons
    var icons = {
        "Plots": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }),
        "High-Rise": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }),
        "Low-Rise": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }),
        "Affordable": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] })
    };

    var currentLayers = { "Plots": L.layerGroup().addTo(map), "High-Rise": L.layerGroup().addTo(map), "Low-Rise": L.layerGroup().addTo(map), "Affordable": L.layerGroup().addTo(map) };

    function addProject(y, x, name, videoUrl, category, price) {
        var marker = L.marker([y, x], { icon: icons[category] });
        
        marker.on('add', function() {
            var icon = marker._icon;
            if (icon) {
                icon.classList.add('bounce-pin');
                setTimeout(() => { icon.classList.remove('bounce-pin'); }, 1500);
            }
        });

        marker.addTo(currentLayers[category]);
        marker.bindPopup(`<div class="popup-card"><strong>${name}</strong><br><span style="color:red">${price}</span><hr><a href="${videoUrl}" target="_blank" class="popup-btn">🎥 Video</a></div>`);
    }

    // --- Verified Data ---
    addProject(529.3, 978.0, "Omaxe Royal Residency 2", "#", "High-Rise", "Best Deal");
    addProject(484.8, 1078.5, "Prosper EPIC", "#", "High-Rise", "Best Deal");
    addProject(440.1, 1043.0, "SOHA Olive Town", "#", "Plots", "Best Deal");
    addProject(720.9, 597.5, "Advitya Homes", "#", "Affordable", "Best Deal");
    addProject(488.3, 927.0, "BPTP Parkland Pride", "#", "Low-Rise", "Best Deal");

    // Layers Control
    var overlayMaps = { "Plots": currentLayers["Plots"], "High-Rise": currentLayers["High-Rise"], "Low-Rise": currentLayers["Low-Rise"], "Affordable": currentLayers["Affordable"] };
    L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

    // --- Verified Drag & Minimize ---
    setTimeout(() => {
        const ctrl = document.querySelector('.leaflet-control-layers');
        if (ctrl) {
            ctrl.style.top = '150px';
            ctrl.style.left = '10px';
            
            const header = document.createElement('div');
            header.className = 'control-header';
            header.innerHTML = '<span>Map Filters</span><span id="minBtn" style="cursor:pointer; padding: 5px;">−</span>';
            ctrl.prepend(header);

            document.getElementById('minBtn').onclick = function(e) {
                e.stopPropagation();
                const list = ctrl.querySelector('.leaflet-control-layers-list');
                const isHidden = list.style.display === 'none';
                list.style.display = isHidden ? 'block' : 'none';
                this.innerText = isHidden ? '−' : '+';
            };

            // Drag Logic for Mobile & Desktop
            let isDragging = false, offset = [0, 0];
            const startDrag = (e) => {
                isDragging = true;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                offset = [ctrl.offsetLeft - clientX, ctrl.offsetTop - clientY];
            };
            const doDrag = (e) => {
                if (!isDragging) return;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                ctrl.style.left = (clientX + offset[0]) + 'px';
                ctrl.style.top = (clientY + offset[1]) + 'px';
                ctrl.style.right = 'auto';
            };
            const stopDrag = () => { isDragging = false; };

            header.addEventListener('mousedown', startDrag);
            header.addEventListener('touchstart', startDrag);
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('touchmove', doDrag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }
    }, 1000);
</script>
</body>
</html>
