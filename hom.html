<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Prince Banga</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; --wa-green: #25D366; --nav-blue: #001f3f; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #f8f9fa; }

        /* Navigation */
        .master-nav {
            background: var(--nav-blue); padding: 12px 0; text-align: center;
            position: fixed; top: 0; width: 100%; z-index: 10000;
            border-bottom: 2px solid #ffb703;
        }
        .master-nav a { color: white; text-decoration: none; margin: 0 10px; font-weight: 600; text-transform: uppercase; font-size: 10px; white-space: nowrap; }

        /* Map */
        #map { height: 100vh; width: 100%; z-index: 1; }

        /* Bouncing Animation */
        @keyframes bounceIn {
            0% { transform: translateY(-500px); opacity: 0; }
            60% { transform: translateY(25px); opacity: 1; }
            100% { transform: translateY(0); }
        }
        .bounce-pin { animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.2) !important; }

        /* --- Filter Box (Draggable & Fixed) --- */
        .leaflet-control-layers {
            background: white !important;
            border: 2px solid var(--primary-red) !important;
            border-radius: 8px !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3) !important;
            min-width: 180px;
            position: fixed !important; 
            top: 140px !important; /* Proper spacing from header */
            left: 10px !important;
            z-index: 9000 !important;
        }
        .control-header { 
            background: var(--primary-red); color: white; padding: 8px; 
            font-weight: bold; cursor: move; border-radius: 6px 6px 0 0;
            display: flex; justify-content: space-between; font-size: 12px;
        }

        /* Header & Footer */
        .map-header {
            position: absolute; top: 65px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 350px; background: rgba(230, 57, 70, 0.95);
            color: white; padding: 10px; border-radius: 12px; z-index: 5000; text-align: center;
        }
        .sticky-footer { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; z-index: 10000; }
        .sticky-btn { flex: 1; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; color: white; font-size: 13px; }
        .btn-call { background: var(--dark-blue); }
        .btn-wa { background: var(--wa-green); }

        .popup-card { text-align: center; width: 160px; }
        .popup-btn { display: block; margin-top: 5px; padding: 6px; color: white !important; text-decoration: none; border-radius: 4px; background: var(--primary-red); font-weight: bold; font-size: 12px; }
    </style>
</head>
<body oncontextmenu="return false;">

<nav class="master-nav">
    <a href="runningprojects.html">Ongoing</a>
    <a href="upcoming.html">Upcoming</a>
    <a href="videos.html">Videos</a>
    <a href="compare.html">Compare</a>
    <a href="about.html">About Us</a>
</nav>

<div class="map-header">
    <strong>Apka Apna Property Advisor</strong><br>
    <a href="tel:+919818811971" style="color:white; text-decoration:none;">📞 98188 11971</a>
</div>

<div id="map"></div>

<div class="sticky-footer">
    <a href="tel:+919818811971" class="sticky-btn btn-call">📞 Call Prince</a>
    <a href="https://wa.me/919818811971" class="sticky-btn btn-wa">💬 WhatsApp</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
    var bounds = [[0, 0], [1000, 1500]];
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    var icons = {
        "Plots": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41] }),
        "High-Rise": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', iconSize: [25, 41], iconAnchor: [12, 41] }),
        "Low-Rise": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png', iconSize: [25, 41], iconAnchor: [12, 41] }),
        "Affordable": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', iconSize: [25, 41], iconAnchor: [12, 41] })
    };

    var layers = { "Plots": L.layerGroup().addTo(map), "High-Rise": L.layerGroup().addTo(map), "Low-Rise": L.layerGroup().addTo(map), "Affordable": L.layerGroup().addTo(map) };

    function addProject(y, x, name, url, cat, price) {
        var m = L.marker([y, x], { icon: icons[cat] });
        m.on('add', function() {
            if (m._icon) {
                m._icon.classList.add('bounce-pin');
                setTimeout(() => m._icon.classList.remove('bounce-pin'), 1200);
            }
        });
        m.addTo(layers[cat]);
        m.bindPopup(`<div class="popup-card"><strong>${name}</strong><br><span>${price}</span><br><a href="${url}" target="_blank" class="popup-btn">🎥 Video</a></div>`);
    }

    // --- ALL PROJECTS RESTORED ---
    addProject(529.3, 978.0, "Omaxe Royal 2", "#", "High-Rise", "Best Deal");
    addProject(484.8, 1078.5, "Prosper EPIC", "#", "High-Rise", "Best Deal");
    addProject(534.8, 1106.3, "Emerald 4BHK", "#", "High-Rise", "Best Deal");
    addProject(668.5, 1212.4, "Tarang Atlantis", "#", "High-Rise", "Best Deal");
    addProject(447.6, 1033.8, "Coral Park", "#", "Plots", "Best Deal");
    addProject(450.3, 989.4, "NeoLiv", "#", "Plots", "Best Deal");
    addProject(440.1, 1043.0, "SOHA Olive", "#", "Plots", "Best Deal");
    addProject(361.6, 642.0, "Dameera Plots", "#", "Plots", "Best Deal");
    addProject(488.3, 927.0, "BPTP Pride", "#", "Low-Rise", "Best Deal");
    addProject(412.6, 1039.5, "Maple Floors", "#", "Low-Rise", "Best Deal");
    addProject(505.5, 1061.3, "Adore Pres.", "#", "Low-Rise", "Best Deal");
    addProject(720.9, 597.5, "Advitya Homes", "#", "Affordable", "Best Deal");
    addProject(428.4, 1071.3, "SOHA Homes", "#", "Affordable", "Best Deal");
    addProject(523.6, 883.1, "Adore Prima 2", "#", "Affordable", "Best Deal");

    // --- Layer Control ---
    var overlay = { "🟢 Plots": layers["Plots"], "🔵 High-Rise": layers["High-Rise"], "🟡 Low-Rise": layers["Low-Rise"], "🟠 Affordable": layers["Affordable"] };
    L.control.layers(null, overlay, { collapsed: false }).addTo(map);

    // --- Draggable Setup ---
    setTimeout(() => {
        const ctrl = document.querySelector('.leaflet-control-layers');
        if (ctrl) {
            const h = document.createElement('div');
            h.className = 'control-header';
            h.innerHTML = '<span>Filters</span><span id="tgl" style="cursor:pointer">−</span>';
            ctrl.prepend(h);

            document.getElementById('tgl').onclick = function() {
                const list = ctrl.querySelector('.leaflet-control-layers-list');
                list.style.display = list.style.display === 'none' ? 'block' : 'none';
                this.innerText = list.style.display === 'none' ? '+' : '−';
            };

            // Simple Drag
            let drag = false, x, y;
            h.onmousedown = (e) => { drag = true; x = ctrl.offsetLeft - e.clientX; y = ctrl.offsetTop - e.clientY; };
            document.onmousemove = (e) => { if(drag) { ctrl.style.left = (e.clientX + x) + 'px'; ctrl.style.top = (e.clientY + y) + 'px'; } };
            document.onmouseup = () => drag = false;
        }
    }, 1000);
</script>
</body>
</html>
