name: Instagram Draft Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.html"
      - "*.html"
      - ".github/scripts/generate-social-drafts.cjs"
      - ".github/workflows/instagram-preview.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "*.html"

permissions:
  contents: read

jobs:
  create-review-drafts:
    name: Build review-only social drafts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate draft captions from changed HTML pages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/generate-social-drafts.cjs "$BASE_SHA" "$HEAD_SHA"

      - name: Upload review drafts
        uses: actions/upload-artifact@v4
        with:
          name: instagram-draft-previews
          path: social-drafts/
          if-no-files-found: warn
          retention-days: 14
