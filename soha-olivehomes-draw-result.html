<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Soha Olive Homes Draw Result 2026</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; text-align: center; padding: 20px; }
        .hero-card { background: #0f172a; color: white; padding: 30px; border-radius: 16px; margin: 20px auto; max-width: 800px; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin-bottom: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px; }
        .btn-download { display: block; background: #0d9488; color: white; padding: 15px; margin: 10px auto; width: 80%; text-decoration: none; border-radius: 8px; font-weight: bold; }
        #result-section { display: none; margin-top: 30px; }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <div class="hero-card">
        <h1>Soha Olive Homes Live Draw</h1>
        
        <!-- YouTube Live यहाँ दिखेगा -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/gRtNK6cBYPU" frameborder="0" allowfullscreen></iframe>
        </div>

        <!-- रिजल्ट सेक्शन (जब आप अपलोड कर दें) -->
        <div id="result-section">
            <p style="color: #ffb703; font-weight: bold;">रिजल्ट घोषित हो चुका है!</p>
            <a href="soha-result.pdf" class="btn-download">📥 मुख्य रिजल्ट (Winner List) डाउनलोड करें</a>
            <a href="soha-waiting-list.pdf" class="btn-download" style="background:#d97706;">📥 वेटिंग लिस्ट (Waiting List) डाउनलोड करें</a>
        </div>
    </div>

    <script>
        // --- मैन्युअल कंट्रोल ---
        // जैसे ही आप पीडीएफ सर्वर पर अपलोड कर दें, इसे 'true' कर दें
        const IS_RESULT_LIVE = false; 

        if (IS_RESULT_LIVE) {
            document.getElementById('result-section').style.display = 'block';
        }
    </script>

    <script src="menu.js"></script>
</body>
</html>
