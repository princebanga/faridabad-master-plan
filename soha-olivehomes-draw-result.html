<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soha Olive Homes Draw Result 2026 | Live Updates</title>
    <meta name="description" content="Check Soha Olive Homes Draw Result 2026. Download official PDF for Result and Waiting List here. Live updates for Faridabad housing project.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://faridabadmasterplan.in/soha-olivehomes-draw-result.html">

    <style>
        :root { --primary-dark: #0f172a; --accent-teal: #0d9488; --gold-amber: #ffb703; --white: #ffffff; }
        body { font-family: sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 20px; }
        .main-wrapper { max-width: 800px; margin: 0 auto; }
        .hero-card { background: var(--primary-dark); color: var(--white); border-radius: 16px; padding: 40px; text-align: center; }
        .timer-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .timer-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; min-width: 70px; }
        .timer-number { font-size: 32px; font-weight: bold; color: var(--gold-amber); }
        .result-section { display: none; background: white; padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-download { display: block; background: var(--accent-teal); color: white; padding: 15px; margin: 10px 0; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .btn-whatsapp { background-color: #25d366; color: white; padding: 12px; text-decoration: none; border-radius: 8px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

    <main class="main-wrapper">
        <!-- टाइमर सेक्शन -->
        <div id="countdown-card" class="hero-card">
            <h1>Soha Olive Homes Draw Result</h1>
            <p>लाइव ड्रा रिजल्ट की घोषणा में शेष समय:</p>
            <div class="timer-grid">
                <div class="timer-box"><div id="hours" class="timer-number">00</div><div>घंटे</div></div>
                <div class="timer-box"><div id="minutes" class="timer-number">00</div><div>मिनट</div></div>
                <div class="timer-box"><div id="seconds" class="timer-number">00</div><div>सेकंड</div></div>
            </div>
        </div>

        <!-- रिजल्ट सेक्शन -->
        <div id="result-wrapper" class="result-section">
            <h2>रिजल्ट घोषित हो चुका है!</h2>
            <p>नीचे दिए गए बटनों से पीडीएफ डाउनलोड करें:</p>
            <a href="soha-result.pdf" target="_blank" class="btn-download">📥 मुख्य रिजल्ट (Winner List) डाउनलोड करें</a>
            <a href="soha-waiting-list.pdf" target="_blank" class="btn-download" style="background:#d97706;">📥 वेटिंग लिस्ट (Waiting List) डाउनलोड करें</a>
            
            <a href="https://wa.me/919818811971" class="btn-whatsapp">💬 अधिक जानकारी के लिए WhatsApp करें</a>
        </div>
    </main>

    <!-- स्क्रिप्ट सेक्शन -->
    <script>
        // 6 जुलाई 2026, 12:00 PM (महीना 6 = जुलाई)
        const targetTime = new Date(2026, 6, 6, 12, 0, 0).getTime();

        const timer = setInterval(() => {
            const now = new Date().getTime();
            const diff = targetTime - now;

            if (diff <= 0) {
                clearInterval(timer);
                document.getElementById('countdown-card').style.display = 'none';
                document.getElementById('result-wrapper').style.display = 'block';
            } else {
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                document.getElementById('hours').innerText = h < 10 ? "0"+h : h;
                document.getElementById('minutes').innerText = m < 10 ? "0"+m : m;
                document.getElementById('seconds').innerText = s < 10 ? "0"+s : s;
            }
        }, 1000);
    </script>

    <!-- menu.js कनेक्ट करने के लिए -->
    <script src="menu.js"></script>

</body>
</html>
