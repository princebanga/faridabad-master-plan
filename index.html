        .sticky-footer { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; z-index: 10000; }
        .sticky-btn { flex: 1; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; color: white; font-size: 13px; }
        .btn-call { background: var(--dark-blue); } .btn-wa { background: var(--wa-green); }
        .popup-card { text-align: center; width: 180px; }
        .popup-btn { display: block; margin-top: 5px; padding: 8px; color: white !important; text-decoration: none; border-radius: 5px; background: var(--primary-red); font-weight: bold; font-size: 12px; }

        /* --- Custom Golden Bouncing Pin Styling --- */
        .future-marker {
            background: none;
            border: none;
        }
        .gold-pin-wrapper {
            position: relative;
            width: 30px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pinBounce 1.2s ease-in-out infinite alternate;
        }
        .gold-pin {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb703 100%);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            position: absolute;
            top: 0;
            box-shadow: -2px 2px 4px rgba(0,0,0,0.3);
        }
        .gold-pin::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #001f3f;
            border-radius: 50%;
            position: absolute;
            top: 9px;
            left: 9px;
        }
        .pin-shadow {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            width: 16px;
            height: 4px;
            position: absolute;
            bottom: -6px;
            left: 7px;
            animation: shadowScale 1.2s ease-in-out infinite alternate;
        }
        @keyframes pinBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        @keyframes shadowScale {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.5); opacity: 0.4; }
        }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // जब पूरा वेबपेज पूरी तरह से लोड (HTML, CSS, Fonts सब कुछ) हो जाएगा, तब ये फंक्शन चलेगा
    window.addEventListener('load', function() {
        
        // 1. मैप इनिशियलाइजेशन शुरू करें
        var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
        L.imageOverlay('map.webp', [[0, 0], [1000, 1500]]).addTo(map);
        map.fitBounds([[0, 0], [1000, 1500]]);

        var layers = { "Plots": L.layerGroup().addTo(map), "High-Rise": L.layerGroup().addTo(map), "Low-Rise": L.layerGroup().addTo(map), "Affordable": L.layerGroup().addTo(map), "Future": L.layerGroup().addTo(map) };
        var allMarkers = [];

        // 2. लूप चलाकर मार्कर डिप्लॉय करें
        projectsData.forEach(p => {
            var markerIcon;

            if (p.isFuture) {
                markerIcon = L.divIcon({
                    className: 'future-marker',
                    html: `
                        <div class="gold-pin-wrapper">
                            <div class="gold-pin"></div>
                            <div class="pin-shadow"></div>
                        </div>
                    `,
                    iconSize: [30, 44],
                    iconAnchor: [15, 42],
                    popupAnchor: [0, -40]
                });
            } else {
                var iconColor = p.cat === 'Plots' ? 'green' : (p.cat === 'High-Rise' ? 'blue' : (p.cat === 'Low-Rise' ? 'yellow' : 'orange'));
                
                markerIcon = L.icon({ 
                    iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${iconColor}.png`, 
                    iconSize: [25, 41], 
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34]
                });
            }

            var marker = L.marker([p.y, p.x], { icon: markerIcon });
            marker.projectName = p.name.toLowerCase();
            
            var statusBadge = '';
            if (p.isFuture) {
                statusBadge = '<span style="background:#ffb703; color:#000; padding:2px 6px; font-size:10px; border-radius:3px; font-weight:bold; display:inline-block; margin-bottom:5px;">FUTURE LAUNCH</span><br>';
            } else if (p.name.toLowerCase().includes("true habitat")) {
                statusBadge = '<span style="background:red; color:white; padding:2px 6px; font-size:10px; border-radius:3px; font-weight:bold; display:inline-block; margin-bottom:5px;">NEW ENTRY</span><br>';
            }

            marker.bindPopup(`<div class="popup-card">${statusBadge}<strong>${p.name}</strong><br><span style="color:red">${p.price}</span><hr><a href="${p.link}" target="_blank" class="popup-btn" style="background:#001f3f;">📄 Details</a><a href="https://wa.me/919818811971" target="_blank" class="popup-btn" style="background:#25D366;">💬 WhatsApp</a></div>`);
            
            marker.addTo(p.isFuture ? layers["Future"] : layers[p.cat]);
            allMarkers.push(marker);

            // True Habitat का पॉपअप ऑटोमैटिक खोलें
            if (p.name.toLowerCase().includes("true habitat")) {
                setTimeout(() => {
                    marker.openPopup();
                }, 300); 
            }
        });

        // 3. अपनी बाहरी लॉजिक फाइल को इनिशियलाइज करें
        initMapLogic(map, allMarkers, layers);
    });
</script>
