<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Prince Banga</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; --wa-green: #25D366; --nav-blue: #001f3f; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #f8f9fa; }

        /* Navigation - No Home, Single Line */
        .master-nav {
            background: var(--nav-blue); padding: 12px 0; text-align: center;
            position: fixed; top: 0; width: 100%; z-index: 10000;
            border-bottom: 2px solid #ffb703; display: flex; justify-content: center;
        }
        .master-nav a { color: white; text-decoration: none; margin: 0 8px; font-weight: 600; font-size: 10px; text-transform: uppercase; white-space: nowrap; }

        /* Map */
        #map { height: 100vh; width: 100%; z-index: 1; }

        /* Bouncing Animation */
        @keyframes bounceIn {
            0% { transform: translateY(-500px); opacity: 0; }
            60% { transform: translateY(20px); opacity: 1; }
            100% { transform: translateY(0); }
        }
        .bounce-pin { animation: bounceIn 0.8s ease-out forwards !important; }

        /* Draggable Filter Box with Search */
        .leaflet-control-layers {
            background: white !important; border: 2px solid var(--primary-red) !important;
            border-radius: 10px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
            min-width: 220px; position: fixed !important; z-index: 9999 !important;
        }
        .control-header { 
            background: var(--primary-red); color: white; padding: 10px; font-weight: bold; 
            cursor: move; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; 
            user-select: none; touch-action: none;
        }
        .search-area { padding: 8px; border-top: 1px solid #eee; }
        #pSearch { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }

        /* UI Elements */
        .map-header {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 350px; background: rgba(230, 57, 70, 0.95);
            color: white; padding: 10px; border-radius: 12px; z-index: 5000; text-align: center;
        }
        .sticky-footer { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; z-index: 10000; }
        .sticky-btn { flex: 1; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; color: white; font-size: 13px; }
        .btn-call { background: var(--dark-blue); }
        .btn-wa { background: var(--wa-green); }

        .popup-card { text-align: center; width: 180px; }
        .popup-btn { display: block; margin-top: 5px; padding: 8px; color: white !important; text-decoration: none; border-radius: 5px; background: var(--primary-red); font-weight: bold; font-size: 12px; }
    </style>
</head>
<body oncontextmenu="return false;">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
    L.imageOverlay('map.webp', [[0, 0], [1000, 1500]]).addTo(map);
    map.fitBounds([[0, 0], [1000, 1500]]);

    var icons = {
        "Plots": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41] }),
        "High-Rise": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', iconSize: [25, 41], iconAnchor: [12, 41] }),
        "Low-Rise": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png', iconSize: [25, 41], iconAnchor: [12, 41] }),
        "Affordable": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', iconSize: [25, 41], iconAnchor: [12, 41] }),
        "Upcoming": L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png', iconSize: [25, 41], iconAnchor: [12, 41] })
    };

    var layers = { 
        "Plots": L.layerGroup().addTo(map), 
        "High-Rise": L.layerGroup().addTo(map), 
        "Low-Rise": L.layerGroup().addTo(map), 
        "Affordable": L.layerGroup().addTo(map),
        "Future": L.layerGroup().addTo(map) 
    };
    var allMarkers = [];

    function addProject(y, x, name, vid, cat, price, isFuture = false) {
        var iconType = isFuture ? "Upcoming" : cat;
        var targetLayer = isFuture ? layers["Future"] : layers[cat];
        
        var m = L.marker([y, x], { icon: icons[iconType] });
        m.projectName = name.toLowerCase();
        
        m.on('add', function() {
            if (m._icon) { m._icon.classList.add('bounce-pin'); setTimeout(()=>m._icon.classList.remove('bounce-pin'), 1200); }
        });

        m.addTo(targetLayer);
        m.bindPopup(`<div class="popup-card"><strong>${name}</strong><br><span style="color:red">${price}</span><hr><a href="${vid}" target="_blank" class="popup-btn">🎥 Video</a></div>`);
        allMarkers.push(m);
    }

    // 1. पुराने फंक्शन की जगह इसे डालें
function addProject(y, x, name, videoUrl, category, price, isUpcoming = false) {
    var iconType = isUpcoming ? "Upcoming" : category;
    // यहाँ ध्यान दें: आपकी लेयर का नाम layers["Future"] है या futureLayers["Future Projects"], उसे मैच करें
    var targetLayer = isUpcoming ? layers["Future"] : layers[category];
    
    var marker = L.marker([y, x], { icon: icons[iconType] });
    marker.projectName = name.toLowerCase();
    
    marker.on('add', function() {
        if (marker._icon) { 
            marker._icon.classList.add('bounce-pin'); 
            setTimeout(() => marker._icon.classList.remove('bounce-pin'), 1200);
        }
    });

    var popupContent = `
        <div class="popup-card">
            <strong style="font-size:14px;">${name}</strong><br>
            <span style="color:#e63946; font-weight:bold; display:block; margin:5px 0;">Rate: ${price}</span>
            <hr style="border:0.5px solid #eee;">
            <a href="${videoUrl}" target="_blank" class="popup-btn" style="background:#e63946; color:white; text-decoration:none; display:block; padding:8px; margin-bottom:5px; border-radius:5px; font-weight:bold; font-size:12px;">🎥 वीडियो देखें</a>
            <a href="https://wa.me/919818811971?text=Hi Prince, I am interested in ${name}. Price: ${price}" target="_blank" class="popup-btn" style="background:#25D366; color:white; text-decoration:none; display:block; padding:8px; border-radius:5px; font-weight:bold; font-size:12px;">💬 WhatsApp Enquiry</a>
        </div>
    `;

    marker.bindPopup(popupContent);
    marker.addTo(targetLayer);
    allMarkers.push(marker);
}

// 2. पुराने डेटा की जगह यह पूरी लिस्ट पेस्ट करें
addProject(529.3, 978.0, "Omaxe Royal Residency 2", "https://www.youtube.com/shorts/oSOD4yy0n3o", "High-Rise", "Best Deal");
addProject(484.8, 1078.5, "Prosper EPIC", "https://www.youtube.com/shorts/iXrhyCeW2nk", "High-Rise", "Best Deal");
addProject(534.8, 1106.3, "Emerald 4BHK", "https://www.youtube.com/watch?v=apYXHrChxEE", "High-Rise", "Best Deal");
addProject(668.5, 1212.4, "Tarang Atlantis", "https://www.youtube.com/watch?v=M8R6RR9EKp8", "High-Rise", "Best Deal");
addProject(447.6, 1033.8, "Coral Park", "https://www.youtube.com/shorts/FFJFlOx2m_w", "Plots", "Best Deal");

addProject(558.6, 805.5, "Townfit 70", "https://www.youtube.com/watch?v=TL2Abh_JxvA", "Plots", "Best Deal");
addProject(440.1, 1043.0, "SOHA Olive Town", "https://www.youtube.com/watch?v=FdvkILluDas", "Plots", "Best Deal");
addProject(361.6, 642.0, "Dameera Plots", "https://www.youtube.com/watch?v=Sv3XyNjT0h4", "Plots", "Best Deal");
addProject(488.3, 927.0, "BPTP Parkland Pride", "https://www.youtube.com/shorts/7n0Kss_6mJs", "Low-Rise", "Best Deal");
addProject(412.6, 1039.5, "Maple Floors", "https://www.youtube.com/shorts/GIu0T7baRpI", "Low-Rise", "Best Deal");
addProject(505.5, 1061.3, "Adore Presidential World", "https://www.youtube.com/shorts/cHRfbJGKcXE", "Low-Rise", "Best Deal");
addProject(720.9, 597.5, "Advitya Homes", "https://www.youtube.com/watch?v=iTiPrQ_tle4", "Affordable", "Best Deal");
addProject(428.4, 1071.3, "SOHA Olive Homes", "https://www.youtube.com/watch?v=WSFvvk6RiLg", "Affordable", "Best Deal");
addProject(523.6, 883.1, "Adore Prima 2", "https://www.youtube.com/shorts/sUa9hTv6SPc", "Affordable", "Best Deal");
addProject(504.5, 875.5, "Prima 1", "https://www.youtube.com/watch?v=UK0th107Ckg", "Affordable", "Best Deal");

// Future/Upcoming
addProject(579.1, 1076.5, "MDPS Floors", "https://www.youtube.com/shorts/GIu0T7baRpI", "Low-Rise", "Coming Soon", true);
addProject(542.0, 680.0, "HSIDC Commercial", "https://www.youtube.com", "Plots", "Upcoming", true);

    var overlay = { 
        "🟢 Plots": layers["Plots"], 
        "🔵 High-Rise": layers["High-Rise"], 
        "🟡 Low-Rise": layers["Low-Rise"], 
        "🟠 Affordable": layers["Affordable"],
        "🔘 Future Projects": layers["Future"] 
    };
    L.control.layers(null, overlay, { collapsed: false }).addTo(map);

    // --- Draggable & Search Logic ---
    setTimeout(() => {
        const ctrl = document.querySelector('.leaflet-control-layers');
        if (ctrl) {
            ctrl.style.top = '140px'; ctrl.style.left = '10px';
            const box = document.createElement('div');
            box.innerHTML = `
                <div class="control-header" id="handle"><span>Map Filters</span><span id="min">−</span></div>
                <div class="search-area"><input type="text" id="pSearch" placeholder="Search Project..." onkeyup="doSearch()"></div>
            `;
            ctrl.prepend(box);

            window.doSearch = function() {
                let val = document.getElementById('pSearch').value.toLowerCase();
                if(val.length < 2) return;
                allMarkers.forEach(m => { if(m.projectName.includes(val)){ map.setView(m.getLatLng(), 1); m.openPopup(); } });
            };

            document.getElementById('min').onclick = function() {
                const list = ctrl.querySelector('.leaflet-control-layers-list');
                const sea = ctrl.querySelector('.search-area');
                const isH = list.style.display === 'none';
                list.style.display = sea.style.display = isH ? 'block' : 'none';
                this.innerText = isH ? '−' : '+';
            };

            let drag = false, off = [0, 0];
            const start = (e) => {
                if(e.target.id === 'pSearch') return;
                drag = true;
                let ev = e.type.includes('touch') ? e.touches[0] : e;
                off = [ctrl.offsetLeft - ev.clientX, ctrl.offsetTop - ev.clientY];
            };
            const move = (e) => {
                if(!drag) return;
                let ev = e.type.includes('touch') ? e.touches[0] : e;
                ctrl.style.left = (ev.clientX + off[0]) + 'px';
                ctrl.style.top = (ev.clientY + off[1]) + 'px';
                ctrl.style.right = 'auto';
            };
            const handle = document.getElementById('handle');
            handle.addEventListener('mousedown', start);
            handle.addEventListener('touchstart', start);
            document.addEventListener('mousemove', move);
            document.addEventListener('touchmove', move);
            document.addEventListener('mouseup', () => drag = false);
            document.addEventListener('touchend', () => drag = false);
        }
    }, 1000);
</script>
