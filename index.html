<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Interactive Map</title>
  
    <meta name="description" content="Explore the Interactive Faridabad Master Plan 2031. High-quality map with sector-wise projects, plots, and real estate insights by Apka Apna Property Advisor.">
    <meta name="author" content="Apka Apna Property Advisor">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; --wa-green: #25D366; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #f8f9fa; }
        #map { height: 100vh; width: 100%; }
        
        /* हेडर स्टाइल */
        .map-header {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 360px; background: rgba(230, 57, 70, 0.95);
            color: white; padding: 10px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1100; text-align: center;
        }
        .map-header h1 { font-size: 15px; margin: 0; font-weight: bold; }
        .video-btn {
            display: inline-block; padding: 6px 15px; background: white;
            color: #e63946; text-decoration: none; font-size: 11px;
            font-weight: bold; border-radius: 20px; margin-top: 5px;
        }

        /* वॉटरमार्क */
        .map-watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            font-size: clamp(30px, 6vw, 60px); color: rgba(0, 0, 0, 0.04) !important;
            z-index: 400; pointer-events: none; font-weight: bold; white-space: nowrap;
        }

        /* डिस्क्लेमर */
        .map-disclaimer {
            position: fixed; bottom: 20px; left: 20px; z-index: 9999; 
            background: rgba(255, 255, 255, 0.9); padding: 10px;
            font-size: 11px; border-radius: 8px; border: 1px solid var(--primary-red);
            max-width: 280px; color: var(--dark-blue); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* फिल्टर बॉक्स और सर्च */
        .leaflet-control-layers-expanded {
            background: rgba(255, 255, 255, 0.95) !important;
            border: 2px solid var(--primary-red) !important; border-radius: 10px !important;
        }
        .control-header {
            background: var(--primary-red); color: white; padding: 8px;
            cursor: move; font-weight: bold; display: flex; justify-content: space-between;
            margin: -10px -10px 10px -10px; border-radius: 8px 8px 0 0;
        }
        .leaflet-control-layers.minimized .leaflet-control-layers-list { display: none; }
        .internal-search { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        #projectSearch { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }

        /* बाउंसिंग एनीमेशन */
        @keyframes bounceIn {
          0% { transform: translateY(-600px); opacity: 0; }
          60% { transform: translateY(20px); opacity: 1; }
          100% { transform: translateY(0); }
        }
        
        .popup-card { text-align: center; width: 180px; }
        .popup-btn { display: block; margin-top: 8px; padding: 10px; color: white !important; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

<div class="map-header">
    <h1>Apka Apna Property Advisor</h1>
    <a href="videos.html" class="video-btn">🎥 View Project Videos</a>
</div>

<div class="map-watermark">@ApkaApnaPropertyAdvisor</div>

<div class="map-disclaimer">
    <strong>Disclaimer:</strong> This map is for informational purposes only. Information is based on Faridabad Master Plan 2031. Please verify with RERA authorities before any investment.
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
    var bounds = [[0, 0], [1000, 1500]]; 
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    var icons = {
        "Plots": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "High-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "Low-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "Affordable": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "Upcoming": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] })
    };

    var layers = { "Plots": L.layerGroup().addTo(map), "High-Rise": L.layerGroup().addTo(map), "Low-Rise": L.layerGroup().addTo(map), "Affordable": L.layerGroup().addTo(map), "Future Projects": L.layerGroup().addTo(map) };
    var allMarkers = [];

    function addProject(y, x, name, videoUrl, category, price, isUpcoming = false) {
        var iconType = isUpcoming ? "Upcoming" : category;
        var targetLayer = isUpcoming ? layers["Future Projects"] : layers[category];
        var marker = L.marker([y, x], { icon: icons[iconType] });
        marker.on('add', function() { if(marker._icon) marker._icon.style.animation = 'bounceIn 0.8s ease-out'; });
        marker.addTo(targetLayer);
        marker.projectName = name.toLowerCase();
        marker.bindPopup(<div class="popup-card"><strong>${name}</strong><br><span style="color:red;font-weight:bold;">${price}</span><a href="${videoUrl}" target="_blank" class="popup-btn" style="background:#e63946;">🎥 वीडियो</a><a href="https://wa.me/919818811971?text=Interested in ${name}" target="_blank" class="popup-btn" style="background:#25D366;">💬 WhatsApp</a></div>);
        allMarkers.push(marker);
    }

    // डेटा एंट्री
    addProject(529.3, 978.0, "Omaxe Royal Residency 2", "https://www.youtube.com/shorts/oSOD4yy0n3o", "High-Rise", "Best Deal");
    addProject(484.8, 1078.5, "Prosper EPIC", "https://www.youtube.com/shorts/iXrhyCeW2nk", "High-Rise", "Best Deal");
    addProject(534.8, 1106.3, "Emerald 4BHK", "https://www.youtube.com/watch?v=apYXHrChxEE", "High-Rise", "Best Deal");
    addProject(668.5, 1212.4, "Tarang Atlantis", "https://www.youtube.com/watch?v=M8R6RR9EKp8", "High-Rise", "Best Deal");
    addProject(447.6, 1033.8, "Coral Park", "https://www.youtube.com/shorts/FFJFlOx2m_w", "Plots", "Best Deal");
    addProject(450.3, 989.4, "NeoLiv", "https://www.youtube.com/shorts/9l6LcFpALBY", "Plots", "Best Deal");
    addProject(558.6, 805.5, "Townfit 70", "https://www.youtube.com/watch?v=TL2Abh_JxvA&t=2s", "Plots", "Best Deal");
    addProject(440.1, 1043.0, "SOHA Olive Town", "https://www.youtube.com/watch?v=FdvkILluDas&t=37s", "Plots", "Best Deal");
    addProject(361.6, 642.0, "Dameera Plots", "https://www.youtube.com/watch?v=Sv3XyNjT0h4&t=11s", "Plots", "Best Deal");
    addProject(488.3, 927.0, "BPTP Parkland Pride", "https://www.youtube.com/shorts/7n0Kss_6mJs", "Low-Rise", "Best Deal");
    addProject(412.6, 1039.5, "Maple Floors", "https://www.youtube.com/shorts/GIu0T7baRpI", "Low-Rise", "Best Deal");
    addProject(505.5, 1061.3, "Adore Presidential World", "https://www.youtube.com/shorts/cHRfbJGKcXE", "Low-Rise", "Best Deal");
    addProject(720.9, 597.5, "Advitya Homes", "https://www.youtube.com/watch?v=iTiPrQ_tle4&t=695s", "Affordable", "Best Deal");
    addProject(428.4, 1071.3, "SOHA Olive Homes", "https://www.youtube.com/watch?v=WSFvvk6RiLg&t=292s", "Affordable", "Best Deal");
    addProject(523.6, 883.1, "Adore Prima 2", "https://www.youtube.com/shorts/sUa9hTv6SPc", "Affordable", "Best Deal");
    addProject(504.5, 875.5, "Prima 1", "https://www.youtube.com/watch?v=UK0th107Ckg&t=230s", "Affordable", "Best Deal");
    addProject(579.1, 1076.5, "MDPS Floors", "#", "Low-Rise", "Coming Soon", true);

    var overlayMaps = { "Plots": layers["Plots"], "High-Rise": layers["High-Rise"], "Low-Rise": layers["Low-Rise"], "Affordable": layers["Affordable"], "Future": layers["Future Projects"], "<div class='internal-search'><input type='text' id='projectSearch' placeholder='Search...' onkeyup='searchProject()'></div>": L.layerGroup() };
    L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

    function searchProject() { var input = document.getElementById('projectSearch').value.toLowerCase(); if (input.length < 2) return; allMarkers.forEach(m => { if (m.projectName.includes(input)) { map.setView(m.getLatLng(), 1); m.openPopup(); } }); }
    
    // मिनिमाइज और ड्रैग लॉजिक
    setTimeout(() => {
        const el = document.querySelector('.leaflet-control-layers');
        const header = document.createElement('div');
        header.className = 'control-header';
        header.innerHTML = '<span>Filters</span><span id="min-btn" style="cursor:pointer;">−</span>';
        el.prepend(header);
        header.onclick = (e) => { if(e.target.id === "min-btn") { el.classList.toggle('minimized'); e.target.innerText = el.classList.contains('minimized') ? '+' : '−'; } };
    }, 1000);

    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
