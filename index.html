<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Interactive Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; --wa-green: #25D366; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #f8f9fa; }
        #map { height: 100vh; width: 100%; }

        /* हेडर स्टाइल */
        .map-header {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 360px; background: rgba(255, 255, 255, 0.95);
            padding: 10px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1100; text-align: center; border: 1px solid #ddd;
        }

        /* बाउंसिंग एनीमेशन */
        @keyframes bounceIn {
          0% { transform: translateY(-600px) scale(0.3); opacity: 0; }
          60% { transform: translateY(30px) scale(1.1); opacity: 1; }
          80% { transform: translateY(-10px) scale(0.95); }
          100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* फिल्टर बॉक्स स्टाइल */
        .leaflet-control-layers-expanded {
            background: rgba(255, 255, 255, 0.95) !important;
            border-radius: 10px !important;
            border: 2px solid var(--primary-red) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2) !important;
        }

        .control-header {
            background: var(--primary-red); color: white; padding: 8px;
            border-radius: 8px 8px 0 0; cursor: move; font-weight: bold;
            display: flex; justify-content: space-between; margin: -10px -10px 10px -10px;
        }

        .leaflet-control-layers.minimized .leaflet-control-layers-list { display: none; }

        /* सर्च बॉक्स */
        .internal-search { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        #projectSearch { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; outline: none; }

        .popup-card { text-align: center; padding: 5px; width: 180px; }
        .popup-btn { display: block; margin-top: 8px; padding: 10px; color: white !important; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-video { background: var(--primary-red); }
        .btn-wa { background: var(--wa-green); }

        #coord-box { position: absolute; bottom: 20px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); color: #0f0; padding: 5px; border-radius: 5px; font-size: 12px; }
        .map-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 50px; color: rgba(0,0,0,0.03); z-index: 400; pointer-events: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="map-header">
    <strong style="color: var(--dark-blue);">Apka Apna Property Advisor</strong><br>
    <small>Faridabad Master Plan 2031 - Interactive Map</small>
</div>

<div id="coord-box">Coordinates: Locked</div>
<div class="map-watermark">@ApkaApnaPropertyAdvisor</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // सुरक्षा
    document.addEventListener('contextmenu', e => e.preventDefault());

    // मैप सेटअप
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1 });
    var bounds = [[0, 0], [1000, 1500]];
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    // आइकन्स
    var icons = {
        "Plots": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }),
        "High-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }),
        "Low-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }),
        "Affordable": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }),
        "Upcoming": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] })
    };

    var currentLayers = { "Plots": L.layerGroup().addTo(map), "High-Rise": L.layerGroup().addTo(map), "Low-Rise": L.layerGroup().addTo(map), "Affordable": L.layerGroup().addTo(map) };
    var futureLayers = { "Future Projects": L.layerGroup().addTo(map) };
    var allMarkers = [];

    // मास्टर फंक्शन: addProject
    function addProject(y, x, name, videoUrl, category, price, isUpcoming = false) {
        var iconType = isUpcoming ? "Upcoming" : category;
        var targetLayer = isUpcoming ? futureLayers["Future Projects"] : currentLayers[category];
        
        var marker = L.marker([y, x], { icon: icons[iconType], opacity: 0 });

        marker.on('add', function() {
            const iconElement = marker._icon;
            if (iconElement) {
                marker.setOpacity(1);
                iconElement.style.animation = 'none';
                iconElement.offsetHeight;
                iconElement.style.animation = 'bounceIn 0.8s ease-out forwards';
            }
        });

        marker.addTo(targetLayer);
        marker.projectName = name.toLowerCase();
        
        var popupContent = `<div class="popup-card">
            <strong>${name}</strong><br><small>${category}</small>
            <span style="color:red; font-weight:bold; display:block; margin:5px 0;">Rate: ${price}</span>
            <a href="${videoUrl}" target="_blank" class="popup-btn btn-video">🎥 वीडियो देखें</a>
            <a href="https://wa.me/919818811971?text=Interested in ${name}" target="_blank" class="popup-btn btn-wa">💬 WhatsApp</a>
        </div>`;
        marker.bindPopup(popupContent);
        allMarkers.push(marker);
    }

    // डेटा एंट्री
    addProject(529.3, 978.0, "Omaxe Royal Residency 2", "https://www.youtube.com/shorts/oSOD4yy0n3o", "High-Rise", "Best Deal");
    addProject(447.6, 1033.8, "Coral Park", "https://www.youtube.com/shorts/FFJFlOx2m_w", "Plots", "Best Deal");
    addProject(450.3, 989.4, "NeoLiv", "https://www.youtube.com/shorts/9l6LcFpALBY", "Plots", "Best Deal");
    addProject(579.1, 1076.5, "MDPS Floors", "#", "Low-Rise", "Coming Soon", true);

    // लेयर कंट्रोल
    var overlayMaps = {
        "<span style='color:green'>Plots</span>": currentLayers["Plots"],
        "<span style='color:blue'>High-Rise</span>": currentLayers["High-Rise"],
        "<span style='color:orange'>Affordable</span>": currentLayers["Affordable"],
        "Future Projects": futureLayers["Future Projects"],
        "<div class='internal-search'><input type='text' id='projectSearch' placeholder='Search...' onkeyup='searchProject()'></div>": L.layerGroup()
    };
    L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

    function searchProject() {
        var input = document.getElementById('projectSearch').value.toLowerCase();
        allMarkers.forEach(m => {
            if (input && m.projectName.includes(input)) {
                map.setView(m.getLatLng(), 1);
                m.openPopup();
            }
        });
    }

    map.on('click', e => {
        document.getElementById('coord-box').innerHTML = "[" + e.latlng.lat.toFixed(1) + ", " + e.latlng.lng.toFixed(1) + "]";
    });

    // ड्रैगेबल और मिनिमाइज लॉजिक
    setTimeout(() => {
        const el = document.querySelector('.leaflet-control-layers');
        if(!el) return;
        
        // हेडर जोड़ें
        const header = document.createElement('div');
        header.className = 'control-header';
        header.innerHTML = '<span>Filters</span><span id="min-btn">−</span>';
        el.prepend(header);

        header.onclick = () => {
            el.classList.toggle('minimized');
            document.getElementById('min-btn').innerText = el.classList.contains('minimized') ? '+' : '−';
        };
    }, 1000);
</script>
</body>
</html>
