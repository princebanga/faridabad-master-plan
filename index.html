[1:28 am, 21/05/2026] Prince Banga: <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Interactive Map</title>
  
    <meta name="description" content="Explore the Interactive Faridabad Master Plan 2031. High-quality map with sector-wise projects, plots, and real estate insights by Apka Apna Property Advisor.">
    <meta name="keywords" content="Faridabad Master Plan 2031, Faridabad Sectors, Real Estate Faridabad, Property Advisor Faridabad, Interactive Map Faridabad">
    <meta name="author" content="Apka Apna Property Advisor">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-red: #e63946;
            --dark-blue: #1d3557;
            --wa-green: #25D366;
        }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; background: #f8f9fa; }
        
        .map-header {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 360px; background: rgba(230, 57, 70, 0.95);
            color: white; padding: 10px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1100; text-align: center;
        }

        .map-header h1 { font-size: 15px; margin: 0; font-weight: bold; }
        .map-header p { font-size: 11px; margin: 2px 0 6px 0; opacity: 0.9; }

        .video-btn {
            display: inline-block; padding: 6px 15px; background: white;
            color: #e63946; text-decoration: none; font-size: 11px;
            font-weight: bold; border-radius: 20px; transition: 0.3s;
        }

        .leaflet-control-layers-expanded {
            cursor: move; background: rgba(255, 255, 255, 0.95) !important;
            border-radius: 10px !important; border: 2px solid #e63946 !important;
            z-index: 1200 !important;
        }

        .internal-search { margin-top: 12px; padding-top: 10px; border-top: 2px solid #eee; }
        #projectSearch { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }

        .popup-card { text-align: center; padding: 5px; width: 180px; }
        .popup-btn { display: block; margin-top: 8px; padding: 10px; color: white !important; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .btn-video { background: var(--primary-red); }
        .btn-wa { background: var(--wa-green); }

        .coord-display {
            position: absolute; bottom: 30px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.7); color: yellow; padding: 5px 10px;
            border-radius: 5px; font-family: monospace; font-size: 12px;
        }

        @keyframes bounceIn {
          0% { transform: translateY(-600px); opacity: 0; }
          60% { transform: translateY(20px); opacity: 1; }
          80% { transform: translateY(-5px); }
          100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="map-header">
    <h1>Apka Apna Property Advisor</h1>
    <p>Faridabad Master Plan 2031 - Interactive Map</p>
    <a href="videos.html" class="video-btn">🎥 View Project Videos</a>
</div>

<div class="coord-display" id="coord-box">Coordinates: [Y, X]</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. मैप सेटअप
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
    var bounds = [[0, 0], [1000, 1500]]; 
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    // 2. आइकन्स
    var icons = {
        "Plots": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
        "High-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
        "Low-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
        "Affordable": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
        "Upcoming": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] })
    };

    // 3. लेयर्स
    var layers = {
        "Plots": L.layerGroup().addTo(map),
        "High-Rise": L.layerGroup().addTo(map),
        "Low-Rise": L.layerGroup().addTo(map),
        "Affordable": L.layerGroup().addTo(map),
        "Future Projects": L.layerGroup().addTo(map)
    };

    var allMarkers = [];

    // 4. प्रोजेक्ट जोड़ने का फंक्शन
    function addProject(y, x, name, videoUrl, category, price, isUpcoming = false) {
        var iconType = isUpcoming ? "Upcoming" : category;
        var targetLayer = isUpcoming ? layers["Future Projects"] : layers[category];
        
        var marker = L.marker([y, x], { icon: icons[iconType] });
        
        marker.on('add', function() {
            if (marker._icon) {
                marker._icon.style.animation = 'bounceIn 0.8s ease-out';
            }
        });

        marker.addTo(targetLayer);
        marker.projectName = name.toLowerCase();
        
        var popupContent = `
            <div class="popup-card">
                <strong>${name}</strong><br><small>${category}</small>
                <span style="color:red; font-weight:bold; display:block; margin:5px 0;">Price: ${price}</span>
                <a href="${videoUrl}" target="_blank" class="popup-btn btn-video">🎥 वीडियो देखें</a>
                <a href="https://wa.me/919818811971?text=Hi, Interested in ${name}" target="_blank" class="popup-btn btn-wa">💬 WhatsApp Enquiry</a>
            </div>
        `;
        marker.bindPopup(popupContent);
        allMarkers.push(marker);
    }

    // --- आपका पूरा ओरिजिनल डेटा ---
    addProject(529.3, 978.0, "Omaxe Royal Residency 2", "https://www.youtube.com/shorts/oSOD4yy0n3o", "High-Rise", "Best Deal");
    addProject(484.8, 1078.5, "Prosper EPIC", "https://www.youtube.com/shorts/iXrhyCeW2nk", "High-Rise", "Best Deal");
    addProject(534.8, 1106.3, "Emerald 4BHK", "https://www.youtube.com/watch?v=apYXHrChxEE", "High-Rise", "Best Deal");
    addProject(668.5, 1212.4, "Tarang Atlantis", "https://www.youtube.com/watch?v=M8R6RR9EKp8", "High-Rise", "Best Deal");
    addProject(447.6, 1033.8, "Coral Park", "https://www.youtube.com/shorts/FFJFlOx2m_w", "Plots", "Best Deal");
    addProject(450.3, 989.4, "NeoLiv", "https://www.youtube.com/shorts/9l6LcFpALBY", "Plots", "Best Deal");
    addProject(558.6, 805.5, "Townfit 70", "https://www.youtube.com/watch?v=TL2Abh_JxvA&t=2s", "Plots", "Best Deal");
    addProject(440.1, 1043.0, "SOHA Olive Town", "https://www.youtube.com/watch?v=FdvkILluDas&t=37s", "Plots", "Best Deal");
    addProject(361.6, 642.0, "Dameera Plots", "https://www.youtube.com/watch?v=Sv3XyNjT0h4&t=11s", "Plots", "Best Deal");
    addProject(488.3, 927.0, "BPTP Parkland Pride", "https://www.youtube.com/shorts/7n0Kss_6mJs", "Low-Rise", "Best Deal");
    addProject(412.6, 1039.5, "Maple Floors", "https://www.youtube.com/shorts/GIu0T7baRpI", "Low-Rise", "Best Deal");
    addProject(505.5, 1061.3, "Adore Presidential World", "https://www.youtube.com/shorts/cHRfbJGKcXE", "Low-Rise", "Best Deal");
    addProject(720.9, 597.5, "Advitya Homes", "https://www.youtube.com/watch?v=iTiPrQ_tle4&t=695s", "Affordable", "Best Deal");
    addProject(428.4, 1071.3, "SOHA Olive Homes", "https://www.youtube.com/watch?v=WSFvvk6RiLg&t=292s", "Affordable", "Best Deal");
    addProject(523.6, 883.1, "Adore Prima 2", "https://www.youtube.com/shorts/sUa9hTv6SPc", "Affordable", "Best Deal");
    addProject(504.5, 875.5, "Prima 1", "https://www.youtube.com/watch?v=UK0th107Ckg&t=230s", "Affordable", "Best Deal");
    addProject(579.1, 1076.5, "MDPS Floors", "#", "Low-Rise", "Coming Soon", true);

    // 5. फिल्टर कंट्रोल
    var overlayMaps = {
        "Plots": layers["Plots"],
        "High-Rise": layers["High-Rise"],
        "Low-Rise": layers["Low-Rise"],
        "Affordable": layers["Affordable"],
        "Future Projects": layers["Future Projects"],
        "<div class='internal-search'><input type='text' id='projectSearch' placeholder='Search...' onkeyup='searchProject()'></div>": L.layerGroup()
    };
    L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

    function searchProject() {
        var input = document.getElementById('projectSearch').value.toLowerCase();
        if (input.length < 2) return;
        allMarkers.forEach(function(m) {
            if (m.projectName.includes(input)) {
                map.setView(m.getLatLng(), 1);
                m.openPopup();
            }
        });
    }

    map.on('click', function(e) {
        document.getElementById('coord-box').innerHTML = "[" + e.latlng.lat.toFixed(1) + ", " + e.latlng.lng.toFixed(1) + "]";
    });

    document.addEventListener('contextmenu', event => event.preventDefault());
</script>
</body>
</html>
