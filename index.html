<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Interactive Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; --wa-green: #25D366; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #f8f9fa; -webkit-user-select: none; user-select: none; }
        #map { height: 100vh; width: 100%; }

        /* हेडर स्टाइल */
        .map-header {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 360px; background: rgba(255, 255, 255, 0.95);
            padding: 10px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1100; text-align: center; border: 2px solid var(--primary-red);
        }

        /* बाउंसिंग एनीमेशन */
        @keyframes bounceIn {
          0% { transform: translateY(-600px) scale(0.3); opacity: 0; }
          60% { transform: translateY(30px) scale(1.1); opacity: 1; }
          80% { transform: translateY(-10px) scale(0.95); }
          100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* फिल्टर बॉक्स स्टाइल */
        .leaflet-control-layers-expanded {
            background: rgba(255, 255, 255, 0.95) !important;
            border-radius: 10px !important;
            border: 2px solid var(--primary-red) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2) !important;
            min-width: 220px !important;
            touch-action: none;
        }

        .control-header {
            background: var(--primary-red); color: white; padding: 8px;
            border-radius: 8px 8px 0 0; cursor: move; font-weight: bold;
            display: flex; justify-content: space-between; margin: -10px -10px 10px -10px;
            font-size: 14px;
        }

        .leaflet-control-layers.minimized .leaflet-control-layers-list { display: none; }

        /* सर्च बॉक्स */
        .internal-search { margin-top: 10px; border-top: 2px solid #eee; padding-top: 10px; }
        #projectSearch { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; outline: none; box-sizing: border-box; }

        /* पॉपअप कार्ड */
        .popup-card { text-align: center; padding: 5px; width: 180px; }
        .popup-btn { display: block; margin-top: 8px; padding: 10px; color: white !important; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 13px; }
        .btn-video { background: var(--primary-red); }
        .btn-wa { background: var(--wa-green); }

        /* वॉटरमार्क और कोऑर्डिनेट्स */
        #coord-box { position: absolute; bottom: 20px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); color: #0f0; padding: 6px 12px; border-radius: 5px; font-family: monospace; font-size: 12px; }
        .map-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 50px; color: rgba(0,0,0,0.03); z-index: 400; pointer-events: none; font-weight: bold; white-space: nowrap; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="map-header">
    <strong style="font-size: 16px; color: var(--dark-blue);">Apka Apna Property Advisor</strong><br>
    <small style="color: #666;">Faridabad Master Plan 2031 - Interactive Map</small>
</div>

<div id="coord-box">Coordinates Locked</div>
<div class="map-watermark">@ApkaApnaPropertyAdvisor</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. मैप और इमेज सेटअप
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
    var bounds = [[0, 0], [1000, 1500]];
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    // 2. आइकन्स सेटअप
    var icons = {
        "Plots": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "High-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "Low-Rise": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "Affordable": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] }),
        "Upcoming": new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] })
    };

    var currentLayers = { 
        "Plots": L.layerGroup().addTo(map), 
        "High-Rise": L.layerGroup().addTo(map), 
        "Low-Rise": L.layerGroup().addTo(map), 
        "Affordable": L.layerGroup().addTo(map) 
    };
    var futureLayers = { "Future Projects": L.layerGroup().addTo(map) };
    var allMarkers = [];

    // 3. मास्टर फंक्शन (addProject)
    function addProject(y, x, name, videoUrl, category, price, isUpcoming = false) {
        var iconType = isUpcoming ? "Upcoming" : category;
        var targetLayer = isUpcoming ? futureLayers["Future Projects"] : currentLayers[category];
        
        var marker = L.marker([y, x], { icon: icons[iconType], opacity: 0 });

        marker.on('add', function() {
            const iconElement = marker._icon;
            if (iconElement) {
                marker.setOpacity(1);
                iconElement.style.animation = 'none';
                iconElement.offsetHeight; // Reflow
                iconElement.style.animation = 'bounceIn 0.8s ease-out forwards';
            }
        });

        marker.addTo(targetLayer);
        marker.projectName = name.toLowerCase();
        
        var popupContent = `<div class="popup-card">
            <strong>${name}</strong><br><small>${category} ${isUpcoming ? '(Upcoming)' : ''}</small>
            <span style="color:red; font-weight:bold; display:block; margin:5px 0;">Rate: ${price}</span>
            <hr style="border:0.5px solid #eee;">
            <a href="${videoUrl}" target="_blank" class="popup-btn btn-video">🎥 वीडियो देखें</a>
            <a href="https://wa.me/919818811971?text=Hi, Interested in ${name}" target="_blank" class="popup-btn btn-wa">💬 WhatsApp Enquiry</a>
        </div>`;
        marker.bindPopup(popupContent);
        allMarkers.push(marker);
    }

    // 4. आपका पूरा डेटा (प्रिंस का ओरिजिनल डेटा)
    addProject(529.3, 978.0, "Omaxe Royal Residency 2", "https://www.youtube.com/shorts/oSOD4yy0n3o", "High-Rise", "Best Deal");
    addProject(484.8, 1078.5, "Prosper EPIC", "https://www.youtube.com/shorts/iXrhyCeW2nk", "High-Rise", "Best Deal");
    addProject(534.8, 1106.3, "Emerald 4BHK", "https://www.youtube.com/watch?v=apYXHrChxEE", "High-Rise", "Best Deal");
    addProject(668.5, 1212.4, "Tarang Atlantis", "https://www.youtube.com/watch?v=M8R6RR9EKp8", "High-Rise", "Best Deal");
    addProject(447.6, 1033.8, "Coral Park", "https://www.youtube.com/shorts/FFJFlOx2m_w", "Plots", "Best Deal");
    addProject(450.3, 989.4, "NeoLiv", "https://www.youtube.com/shorts/9l6LcFpALBY", "Plots", "Best Deal");
    addProject(558.6, 805.5, "Townfit 70", "https://www.youtube.com/watch?v=TL2Abh_JxvA&t=2s", "Plots", "Best Deal");
    addProject(440.1, 1043.0, "SOHA Olive Town", "https://www.youtube.com/watch?v=FdvkILluDas&t=37s", "Plots", "Best Deal");
    addProject(361.6, 642.0, "Dameera Plots", "https://www.youtube.com/watch?v=Sv3XyNjT0h4&t=11s", "Plots", "Best Deal");
    addProject(488.3, 927.0, "BPTP Parkland Pride", "https://www.youtube.com/shorts/7n0Kss_6mJs", "Low-Rise", "Best Deal");
    addProject(412.6, 1039.5, "Maple Floors", "https://www.youtube.com/shorts/GIu0T7baRpI", "Low-Rise", "Best Deal");
    addProject(505.5, 1061.3, "Adore Presidential World", "https://www.youtube.com/shorts/cHRfbJGKcXE", "Low-Rise", "Best Deal");
    addProject(720.9, 597.5, "Advitya Homes", "https://www.youtube.com/watch?v=iTiPrQ_tle4&t=695s", "Affordable", "Best Deal");
    addProject(428.4, 1071.3, "SOHA Olive Homes", "https://www.youtube.com/watch?v=WSFvvk6RiLg&t=292s", "Affordable", "Best Deal");
    addProject(523.6, 883.1, "Adore Prima 2", "https://www.youtube.com/shorts/sUa9hTv6SPc", "Affordable", "Best Deal");
    addProject(504.5, 875.5, "Prima 1", "https://www.youtube.com/watch?v=UK0th107Ckg&t=230s", "Affordable", "Best Deal");
    addProject(579.1, 1076.5, "MDPS Floors", "https://www.youtube.com/shorts/GIu0T7baRpI", "Low-Rise", "Coming Soon", true);

    // 5. लेयर कंट्रोल (फिल्टर बॉक्स)
    var overlayMaps = {
        "<span style='color:green; font-weight:bold'>Plots</span>": currentLayers["Plots"],
        "<span style='color:blue; font-weight:bold'>High-Rise</span>": currentLayers["High-Rise"],
        "<span style='color:#b8860b; font-weight:bold'>Low-Rise</span>": currentLayers["Low-Rise"],
        "<span style='color:orange; font-weight:bold'>Affordable</span>": currentLayers["Affordable"],
        "<span style='color:black; font-weight:bold'>Future Projects</span>": futureLayers["Future Projects"],
        "<div class='internal-search'><input type='text' id='projectSearch' placeholder='Search Project...' onkeyup='searchProject()'></div>": L.layerGroup()
    };
    L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

    function searchProject() {
        var input = document.getElementById('projectSearch').value.toLowerCase();
        if(input.length < 2) return;
        allMarkers.forEach(m => {
            if (m.projectName.includes(input)) {
                map.setView(m.getLatLng(), 1);
                m.openPopup();
            }
        });
    }

    // 6. यूटिलिटी: क्लिक कोऑर्डिनेट्स
    map.on('click', e => {
        document.getElementById('coord-box').innerHTML = "[" + e.latlng.lat.toFixed(1) + ", " + e.latlng.lng.toFixed(1) + "]";
    });

    // 7. ड्रैगेबल और स्मार्ट मिनिमाइज लॉजिक
    function makeDraggable(el) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        el.style.top = '115px'; el.style.right = '20px'; el.style.left = 'auto'; el.style.position = 'fixed';
        
        el.onmousedown = dragMouseDown;
        el.ontouchstart = dragMouseDown;

        function dragMouseDown(e) {
            if (["INPUT", "LABEL"].includes(e.target.tagName)) return;
            pos3 = e.clientX || e.touches[0].clientX;
            pos4 = e.clientY || e.touches[0].clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (e) => {
                let x = e.clientX || e.touches[0].clientX;
                let y = e.clientY || e.touches[0].clientY;
                pos1 = pos3 - x; pos2 = pos4 - y; pos3 = x; pos4 = y;
                el.style.top = (el.offsetTop - pos2) + "px"; el.style.left = (el.offsetLeft - pos1) + "px";
            };
        }
    }

    setTimeout(() => {
        const el = document.querySelector('.leaflet-control-layers');
        if(!el) return;
        makeDraggable(el);
        
        const header = document.createElement('div');
        header.className = 'control-header';
        header.innerHTML = '<span>Map Filters</span><span id="min-btn">−</span>';
        el.prepend(header);

        header.onclick = (e) => {
            if(e.target.id === "min-btn" || e.target.tagName === "SPAN"){
                el.classList.toggle('minimized');
                document.getElementById('min-btn').innerText = el.classList.contains('minimized') ? '+' : '−';
            }
        };
    }, 1500);

    // राइट-क्लिक सुरक्षा
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>

</body>
</html>
