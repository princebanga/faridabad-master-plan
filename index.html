<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Master Plan 2031 | Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; }
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; background: #fff; }

        /* आपका ओरिजिनल हेडर */
        .map-header {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 380px; background: #ff4d4d; color: white;
            padding: 12px; border-radius: 12px; z-index: 1100; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .video-btn { display: inline-block; padding: 5px 15px; background: white; color: #ff4d4d; text-decoration: none; border-radius: 20px; font-size: 11px; font-weight: bold; margin-top: 5px; }

        /* वॉटरमार्क */
        .map-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 50px; color: rgba(0,0,0,0.05); z-index: 400; pointer-events: none; font-weight: bold; }

        /* डिस्क्लेमर */
        .map-disclaimer { position: fixed; bottom: 20px; left: 15px; z-index: 1000; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; border: 1px solid #ff4d4d; font-size: 11px; max-width: 260px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        /* लेयर कंट्रोल */
        .leaflet-control-layers-expanded { background: white !important; border: 2px solid #ff4d4d !important; border-radius: 10px !important; }
        .control-header { background: #ff4d4d; color: white; padding: 8px; border-radius: 8px 8px 0 0; cursor: move; font-weight: bold; display: flex; justify-content: space-between; margin: -10px -10px 10px -10px; }
        .leaflet-control-layers.minimized .leaflet-control-layers-list { display: none; }
    </style>
</head>
<body>

<div class="map-header">
    <strong>Apka Apna Property Advisor</strong><br>
    <a href="videos.html" class="video-btn">🎥 View Project Videos</a>
</div>

<div class="map-watermark">@ApkaApnaPropertyAdvisor</div>

<div class="map-disclaimer">
    <strong>Disclaimer:</strong> This map is for info only. Based on Faridabad Master Plan 2031. Verify with RERA.
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -2, attributionControl: false });
    var bounds = [[0, 0], [1000, 1500]];
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    var iconSet = { iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', shadowSize: [41, 41] };
    var icons = {
        "Plots": new L.Icon({ ...iconSet, iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png' }),
        "High-Rise": new L.Icon({ ...iconSet, iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png' }),
        "Low-Rise": new L.Icon({ ...iconSet, iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png' }),
        "Affordable": new L.Icon({ ...iconSet, iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png' }),
        "Upcoming": new L.Icon({ ...iconSet, iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png' })
    };

    var lyrs = { "Plots": L.layerGroup().addTo(map), "High-Rise": L.layerGroup().addTo(map), "Low-Rise": L.layerGroup().addTo(map), "Affordable": L.layerGroup().addTo(map), "Future": L.layerGroup().addTo(map) };
    var allMarkers = [];

    function addProject(y, x, name, vid, cat, price, isFuture = false) {
        var m = L.marker([y, x], { icon: isFuture ? icons["Upcoming"] : icons[cat] });
        m.addTo(isFuture ? lyrs["Future"] : lyrs[cat]);
        m.projectName = name.toLowerCase();
        m.bindPopup(<b>${name}</b><br><span style="color:red;">${price}</span><br><a href="${vid}" target="_blank">Watch Video</a>);
        allMarkers.push(m);
    }

    // --- डेटा लिस्ट ---
    addProject(529.3, 978.0, "Omaxe Royal Residency 2", "https://www.youtube.com/shorts/oSOD4yy0n3o", "High-Rise", "Best Deal");
    addProject(484.8, 1078.5, "Prosper EPIC", "https://www.youtube.com/shorts/iXrhyCeW2nk", "High-Rise", "Best Deal");
    addProject(534.8, 1106.3, "Emerald 4BHK", "https://www.youtube.com/watch?v=apYXHrChxEE", "High-Rise", "Best Deal");
    addProject(668.5, 1212.4, "Tarang Atlantis", "https://www.youtube.com/watch?v=M8R6RR9EKp8", "High-Rise", "Best Deal");
    addProject(447.6, 1033.8, "Coral Park", "https://www.youtube.com/shorts/FFJFlOx2m_w", "Plots", "Best Deal");
    addProject(450.3, 989.4, "NeoLiv", "https://www.youtube.com/shorts/9l6LcFpALBY", "Plots", "Best Deal");
    addProject(558.6, 805.5, "Townfit 70", "https://www.youtube.com/watch?v=TL2Abh_JxvA&t=2s", "Plots", "Best Deal");
    addProject(440.1, 1043.0, "SOHA Olive Town", "https://www.youtube.com/watch?v=FdvkILluDas&t=37s", "Plots", "Best Deal");
    addProject(361.6, 642.0, "Dameera Plots", "https://www.youtube.com/watch?v=Sv3XyNjT0h4&t=11s", "Plots", "Best Deal");
    addProject(488.3, 927.0, "BPTP Parkland Pride", "https://www.youtube.com/shorts/7n0Kss_6mJs", "Low-Rise", "Best Deal");
    addProject(412.6, 1039.5, "Maple Floors", "https://www.youtube.com/shorts/GIu0T7baRpI", "Low-Rise", "Best Deal");
    addProject(505.5, 1061.3, "Adore Presidential World", "https://www.youtube.com/shorts/cHRfbJGKcXE", "Low-Rise", "Best Deal");
    addProject(720.9, 597.5, "Advitya Homes", "https://www.youtube.com/watch?v=iTiPrQ_tle4&t=695s", "Affordable", "Best Deal");
    addProject(428.4, 1071.3, "SOHA Olive Homes", "https://www.youtube.com/watch?v=WSFvvk6RiLg&t=292s", "Affordable", "Best Deal");
    addProject(523.6, 883.1, "Adore Prima 2", "https://www.youtube.com/shorts/sUa9hTv6SPc", "Affordable", "Best Deal");
    addProject(504.5, 875.5, "Prima 1", "https://www.youtube.com/watch?v=UK0th107Ckg&t=230s", "Affordable", "Best Deal");
    addProject(579.1, 1076.5, "MDPS Floors", "#", "Low-Rise", "Coming Soon", true);

    L.control.layers(null, lyrs, { collapsed: false }).addTo(map);

    // मिनिमाइज बटन लॉजिक
    setTimeout(() => {
        const el = document.querySelector('.leaflet-control-layers');
        const header = document.createElement('div');
        header.className = 'control-header';
        header.innerHTML = '<span>Filters</span><span id="min-btn">−</span>';
        el.prepend(header);
        header.onclick = (e) => { if(e.target.id === "min-btn") { el.classList.toggle('minimized'); e.target.innerText = el.classList.contains('minimized') ? '+' : '−'; } };
    }, 1000);
</script>
</body>
</html>
