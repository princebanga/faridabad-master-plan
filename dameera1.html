<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaMeera City | Sector 121 Faridabad Premium Plots</title>
    <style>
        :root { --primary-slate: #0f172a; --accent-teal: #0d9488; --electric-amber: #f59e0b; --pure-crimson: #e11d48; --background-canvas: #f8fafc; --text-dark: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--background-canvas); color: var(--text-dark); line-height: 1.6; }
        
        header { background: linear-gradient(135deg, var(--primary-slate) 0%, #1e1b4b 100%); padding: 30px 5%; color: #f1f5f9; border-bottom: 4px solid var(--accent-teal); }
        .header-container { max-width: 1200px; margin: 0 auto; }
        .brand-block h1 { font-size: 32px; font-weight: 800; text-transform: uppercase; }
        
        main { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 7fr 5fr; gap: 40px; }
        .media-showcase-card { background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .section-headline { font-size: 22px; font-weight: 800; margin-bottom: 20px; border-left: 5px solid var(--accent-teal); padding-left: 12px; }

        /* 360 व्यू के लिए नया CSS */
        .virtual-tour-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .tour-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .tour-btn:hover { border-color: var(--accent-teal); background: rgba(13, 148, 136, 0.05); }
        .iframe-container { display: none; margin-bottom: 30px; border-radius: 12px; overflow: hidden; background: #000; }
        .iframe-container.active { display: block; }
        iframe { width: 100%; height: 500px; border: none; }

        .metrics-ledger-card { background: #ffffff; padding: 30px; border-radius: 16px; border: 1px solid #e2e8f0; align-self: start; }
        .ledger-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .ledger-table td { padding: 16px 12px; border-bottom: 1px solid #f1f5f9; }
        .ledger-key { font-weight: 700; color: #64748b; }
        .ledger-val { font-weight: 800; text-align: right; }
        
        .action-btn { display: block; width: 100%; padding: 16px; margin-bottom: 10px; text-align: center; font-weight: 800; color: #fff; border-radius: 10px; text-decoration: none; }
        .btn-whatsapp { background: #25d366; }
        .btn-call { background: var(--primary-slate); }

        @media (max-width: 968px) { main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-block">
                <h1>DaMeera City</h1>
                <p>DDJAY Plotted Township | Sector 121, Faridabad</p>
            </div>
        </div>
    </header>

    <main>
        <section class="media-showcase-card">
            <h2 class="section-headline">Official Video Presentation</h2>
            <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 30px;">
                <iframe src="https://www.youtube.com/embed/Sv3XyNjT0h4" style="position: absolute; width:100%; height:100%;" allowfullscreen></iframe>
            </div>

            <h2 class="section-headline">Interactive 360° Experience</h2>
            <div class="virtual-tour-grid">
                <button class="tour-btn" onclick="showTour('tour1')">🏛️ Entrance</button>
                <button class="tour-btn" onclick="showTour('tour2')">🛣️ Project Inside</button>
                <button class="tour-btn" onclick="showTour('tour3')">🌳 Garden View</button>
            </div>

            <div id="tour1" class="iframe-container">
                <iframe src="http://teliportme.com/embed/2585107" loading="lazy"></iframe>
            </div>
            <div id="tour2" class="iframe-container">
                <iframe src="http://teliportme.com/embed/2585146" loading="lazy"></iframe>
            </div>
            <div id="tour3" class="iframe-container">
                <iframe src="http://teliportme.com/embed/2585144" loading="lazy"></iframe>
            </div>
        </section>

        <section class="metrics-ledger-card">
            <h2 class="section-headline">Connectivity Matrix</h2>
            <table class="ledger-table">
                <tr><td class="ledger-key">Delhi-Mumbai Exp.</td><td class="ledger-val">5 Mins Drive</td></tr>
                <tr><td class="ledger-key">EPE Corridor</td><td class="ledger-val">2.2 KM</td></tr>
                <tr><td class="ledger-key">Total Units</td><td class="ledger-val">131 Premium Plots</td></tr>
            </table>
            
            <a href="https://wa.me/919818811971" class="action-btn btn-whatsapp">💬 Request Brochure</a>
            <a href="tel:+919818811971" class="action-btn btn-call">📞 Connect with Expert</a>
        </section>
    </main>

    <script>
        function showTour(tourId) {
            document.querySelectorAll('.iframe-container').forEach(div => div.classList.remove('active'));
            document.getElementById(tourId).classList.add('active');
        }
    </script>
</body>
</html>
