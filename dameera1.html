<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaMeera City | Sector 121 Faridabad Premium Plots</title>
    <style>
        :root { --primary-slate: #0f172a; --accent-teal: #0d9488; --electric-amber: #f59e0b; --pure-crimson: #e11d48; --background-canvas: #f8fafc; --text-dark: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--background-canvas); color: var(--text-dark); line-height: 1.6; }

        header { background: linear-gradient(135deg, var(--primary-slate) 0%, #1e1b4b 100%); padding: 30px 5%; color: #fff; border-bottom: 4px solid var(--accent-teal); }
        .header-container { max-width: 1200px; margin: 0 auto; }
        .brand-block h1 { font-size: 32px; font-weight: 800; text-transform: uppercase; }

        main { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 7fr 5fr; gap: 40px; }
        .media-showcase-card { background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .section-headline { font-size: 22px; font-weight: 800; margin-bottom: 20px; border-left: 5px solid var(--accent-teal); padding-left: 12px; }

        /* 360 Tabbed Gallery Style */
        .tour-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-weight: 700; background: #f1f5f9; transition: 0.3s; }
        .tab-btn.active { background: var(--accent-teal); color: white; border-color: var(--accent-teal); }
        .iframe-wrapper { display: none; border-radius: 12px; overflow: hidden; height: 500px; background: #000; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .iframe-wrapper.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }

        .metrics-ledger-card { background: #ffffff; padding: 30px; border-radius: 16px; border: 1px solid #e2e8f0; align-self: start; }
        .ledger-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .ledger-table td { padding: 16px 12px; border-bottom: 1px solid #f1f5f9; }
        .ledger-val { font-weight: 800; text-align: right; }
        
        .action-btn { display: block; width: 100%; padding: 16px; margin-bottom: 10px; text-align: center; font-weight: 800; color: #fff; border-radius: 10px; text-decoration: none; text-transform: uppercase; }
        .btn-whatsapp { background: #25d366; }
        .btn-call { background: var(--primary-slate); }

        @media (max-width: 968px) { main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-block">
                <h1>DaMeera City</h1>
                <p>DDJAY Plotted Township | Sector 121, Faridabad</p>
            </div>
        </div>
    </header>

    <main>
        <section class="media-showcase-card">
            <h2 class="section-headline">Official Video Presentation</h2>
            <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 30px;">
                <iframe src="https://www.youtube.com/embed/Sv3XyNjT0h4" style="position: absolute; width:100%; height:100%;" allowfullscreen></iframe>
            </div>

            <h2 class="section-headline">Interactive 360° Experience</h2>
            <div class="tour-tabs">
                <button class="tab-btn active" onclick="openTour(event, 'tour1')">🏛️ Entrance</button>
                <button class="tab-btn" onclick="openTour(event, 'tour2')">🛣️ Inside View</button>
                <button class="tab-btn" onclick="openTour(event, 'tour3')">🌳 Garden View</button>
            </div>

            <div id="tour1" class="iframe-wrapper active">
                <iframe src="http://teliportme.com/embed/2585107"></iframe>
            </div>
            <div id="tour2" class="iframe-wrapper">
                <iframe src="http://teliportme.com/embed/2585146"></iframe>
            </div>
            <div id="tour3" class="iframe-wrapper">
                <iframe src="http://teliportme.com/embed/2585144"></iframe>
            </div>
        </section>

        <section class="metrics-ledger-card">
            <h2 class="section-headline">Connectivity Matrix</h2>
            <table class="ledger-table">
                <tr><td>Delhi-Mumbai Exp.</td><td class="ledger-val" style="color: var(--pure-crimson);">5 Mins Drive</td></tr>
                <tr><td>EPE Corridor</td><td class="ledger-val">2.2 KM Direct</td></tr>
                <tr><td>Total Units</td><td class="ledger-val">131 Premium Plots</td></tr>
            </table>
            <a href="https://wa.me/919818811971" class="action-btn btn-whatsapp">💬 Request Brochure</a>
            <a href="tel:+919818811971" class="action-btn btn-call">📞 Call Location Expert</a>
        </section>
    </main>

    <script>
        function openTour(evt, tourId) {
            document.querySelectorAll('.iframe-wrapper').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tourId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
