<style>
    .layout-plan-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        border: 1px solid #e2e8f0;
        margin-top: 30px;
    }
    .map-container {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #cbd5e1;
        cursor: zoom-in;
        transition: transform 0.3s ease;
    }
    .map-container img {
        width: 100%;
        display: block;
        height: auto;
    }
    .map-caption {
        font-size: 13px;
        color: #64748b;
        margin-top: 10px;
        font-style: italic;
        text-align: center;
    }
    /* Modal/Full-screen logic for the map */
    .map-modal {
        display: none;
        position: fixed;
        z-index: 10001;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        justify-content: center;
        align-items: center;
    }
    .map-modal img {
        max-width: 95%;
        max-height: 95%;
        border-radius: 8px;
    }
    .close-modal {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 40px;
        cursor: pointer;
    }
</style>

<section class="media-showcase-card">
    <h2 class="section-headline" style="margin-top: 40px;">Master Layout Plan</h2>
    <div class="map-container" onclick="document.getElementById('imgModal').style.display='flex'">
        <img src="Dameera Map with plot numbers and size.jpg" alt="DaMeera City Sector 121 Layout Plan">
    </div>
    <p class="map-caption">Click the map to view full-size plot details and dimensions.</p>
</section>

<div id="imgModal" class="map-modal">
    <span class="close-modal" onclick="this.parentElement.style.display='none'">&times;</span>
    <img src="Dameera Map with plot numbers and size.jpg" alt="Full Scale Layout">
</div>
