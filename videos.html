<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Library | Apka Apna Property Advisor</title>
    <style>
        :root { --primary-red: #e63946; --dark-blue: #1d3557; }
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 0; }
        .navbar { background: white; padding: 15px; text-align: center; border-bottom: 3px solid var(--primary-red); position: sticky; top: 0; z-index: 1000; }
        .btn-back { text-decoration: none; color: var(--primary-red); font-weight: bold; border: 2px solid var(--primary-red); padding: 5px 15px; border-radius: 20px; float: left; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .section-title { color: var(--dark-blue); border-left: 5px solid var(--primary-red); padding-left: 15px; margin: 30px 0 20px; font-size: 22px; text-transform: uppercase; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; min-height: 100px; }
        .video-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .video-thumb { width: 100%; height: 180px; object-fit: cover; }
        .video-info { padding: 15px; }
        .project-name { font-size: 16px; font-weight: bold; color: var(--dark-blue); display: block; margin-bottom: 5px; }
        .sector-tag { color: #666; font-size: 12px; display: block; margin-bottom: 10px; }
        .watch-btn { display: block; background: var(--primary-red); color: white !important; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="btn-back">← Back</a>
        <h2 style="margin:0;">Real Estate Video Library</h2>
    </div>

    <div class="container">
        <h2 class="section-title">📊 Monthly Market Insights</h2>
        <div class="video-grid" id="market-updates">Loading updates...</div>

        <h2 class="section-title">🏢 Featured Project Tours</h2>
        <div class="video-grid" id="project-gallery">Loading tours...</div>
    </div>

    <script>
        const monthlyUpdates = [
            { name: "April Monthly Update 2026", date: "April 2026", id: "6JvWUhBSPvg&t" }, // लेटेस्ट वीडियो
            { name: "Market Update - Feb 2026", date: "Feb 2026", id: "2kLT5Dqb_dE" },
            { name: "December Market Analysis", date: "Dec 2025", id: "RcWK9vrAH3c" },
            { name: "Faridabad Price Trends", date: "Sept 2025", id: "-jmiUznJNoo" }
        ];

        const projects = [
            { name: "Tarang Atlantis", sector: "Sector 85", id: "M8R6RR9EKp8" },
            { name: "SOHA Olive Town", sector: "Sector 98", id: "FdvkILluDas" },
            { name: "Omaxe Royal Residency 2", sector: "Sector 79", id: "oSOD4yy0n3o" },
            { name: "NeoLiv RERA Plots", sector: "Sector 12", id: "9l6LcFpALBY" },
            { name: "Emerald Gulmohar", sector: "Sector 97", id: "apYXHrChxEE" },
            { name: "Coral Park", sector: "Sector 89", id: "FFJFlOx2m_w" },
            { name: "BPTP Parkland Pride", sector: "Sector 77", id: "7n0Kss_6mJs" },
            { name: "Adore Presidential World", sector: "Sector 84", id: "cHRfbJGKcXE" }
        ];
        function renderVideos() {
            const updateDiv = document.getElementById('market-updates');
            const projectDiv = document.getElementById('project-gallery');
            
            updateDiv.innerHTML = "";
            projectDiv.innerHTML = "";

            monthlyUpdates.forEach(vid => {
                updateDiv.innerHTML += `
                    <div class="video-card">
                        <img class="video-thumb" src="https://img.youtube.com/vi/${vid.id}/mqdefault.jpg">
                        <div class="video-info">
                            <span class="project-name">${vid.name}</span>
                            <span class="sector-tag">📅 ${vid.date}</span>
                            <a href="https://youtube.com/watch?v=${vid.id}" target="_blank" class="watch-btn">WATCH NOW</a>
                        </div>
                    </div>`;
            });

            projects.forEach(vid => {
                projectDiv.innerHTML += `
                    <div class="video-card">
                        <img class="video-thumb" src="https://img.youtube.com/vi/${vid.id}/mqdefault.jpg">
                        <div class="video-info">
                            <span class="project-name">${vid.name}</span>
                            <span class="sector-tag">📍 ${vid.sector}</span>
                            <a href="https://youtube.com/watch?v=${vid.id}" target="_blank" class="watch-btn">WATCH NOW</a>
                        </div>
                    </div>`;
            });
        }

        // पेज लोड होते ही फंक्शन चलायें
        window.onload = renderVideos;
    </script>
</body>
</html>
