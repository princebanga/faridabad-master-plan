<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rejected / Re-hearing HRERA Projects | Haryana</title><meta name="description" content="Haryana HRERA projects with rejected or returned proceedings followed by re-hearing or fresh proceedings."><style>body{font-family:Arial;background:#f4f7f9;color:#172033;margin:0}.hero{background:#7f1d1d;color:#fff;padding:28px 16px;text-align:center}.wrap{max-width:1150px;margin:20px auto;padding:0 14px}.note{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.card{background:#fff;padding:16px;border-radius:14px;border-left:5px solid #dc2626;box-shadow:0 2px 12px #0001}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.meta div{background:#f8fafc;padding:8px;border-radius:8px}.meta b{display:block}</style></head><body><section class="hero"><h1>Rejected / Returned → Re-hearing Watch</h1><p>Category 2 of 4</p></section><main class="wrap"><div class="note"><b>Rule:</b> This page is for a rejection/return/adverse proceeding where the record also shows a later hearing, reopening, extension or fresh proceeding. Purely lapsed/closed records are not mixed into this category.</div><div id="grid" class="grid"></div></main><script>const data=[];const g=document.getElementById('grid');g.innerHTML=data.length?data.map(x=>card(x)).join(''):'<div class="note"><b>No individually verified records in this bucket yet.</b><br>They will be added only after both the adverse event and subsequent proceeding are verified.</div>';function card(x){return '<article class="card"><h2>'+x.name+'</h2><div class="meta"><div><b>HRERA record</b>'+x.rid+'</div><div><b>District</b>'+x.district+'</div><div><b>Promoter</b>'+x.promoter+'</div><div><b>Latest proceeding</b>'+x.status+'</div></div></article>'}</script></body></html>
